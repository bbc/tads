  /tracks/{track_id}/events:
    parameters:
      - name: track_id
        in: path
        required: true
        schema:
          $ref: schemas/uuid.json
        description: The Track identifier.
    head:
      summary: List Track Events
      description: Return `/tracks/{track_id}/events` path headers
      operationId: HEAD_tracks-track_id-events
      tags:
        - TrackEvents
      parameters:
        - name: ids
          in: query
          description: Filter on Track Event identifier(s).
          schema:
            $ref: schemas/uuid-list.json
        - name: timerange
          in: query
          description: Return only the Track Events that partially or wholly overlap with the timerange specified.
          schema:
            default: _
            allOf:
              - $ref: schemas/timerange.json
        - name: reverse_order
          in: query
          description: Return Track Events in reverse time order.
          schema:
            default: false
            type: boolean
        - $ref: "#/components/parameters/trait_resource_paged_page"
        - $ref: "#/components/parameters/trait_resource_paged_limit"
      responses:
        "200":
          description: ""
          headers:
            Link:
              $ref: "#/components/headers/Link"
            X-Paging-NextKey:
              $ref: "#/components/headers/X-Paging-NextKey"
            X-Paging-Limit:
              $ref: "#/components/headers/X-Paging-Limit"
            X-Paging-Count:
              $ref: "#/components/headers/X-Paging-Count"
            X-Paging-Reverse-Order:
              $ref: "#/components/headers/X-Paging-Reverse-Order"
            X-Paging-Timerange:
              $ref: "#/components/headers/X-Paging-Timerange"
        "400":
          $ref: "#/components/responses/trait_resource_400_invalid_query_options"
        "404":
          $ref: "#/components/responses/trait_resource_404_path_not_found"
    get:
      summary: List Track Events
      description: |
        Return the list of Track Events owned by the Track.

        Each Track Event attaches payload data to a specified timerange on the Track timeline.

        The response body is an array of Track Events. This array MAY be empty.

        Sorting of results:

        * Track Events are sorted by `timerange`, in ascending order by default.
        * When sorting in ascending order: Track Events are sorted using the start timestamp of the `timerange`.
        * When sorting in descending order: Track Events are sorted by the end timestamp of the `timerange`.
        * If multiple Track Events have the same sort order:
          * These Track Events are then sorted by the other timestamp of the `timerange`.
          * If multiple Track Events still have the same sort order:
            * These Track Events are then sorted by `id`.
        * Service Implementations MUST take into account the inclusive/exclusive marker associated with a timestamp when it is used for sorting.

        Pagination:

        * Clients should use the pagination options to limit the results to a timerange and/or count.
        * Service Implementations may also limit the results returned. This will be signalled via the paging headers in the response.
      operationId: GET_tracks-track_id-events
      tags:
        - TrackEvents
      parameters:
        - name: ids
          in: query
          description: Filter on Track Event identifier(s).
          schema:
            $ref: schemas/uuid-list.json
        - name: timerange
          in: query
          description: Return only the Track Events that partially or wholly overlap with the timerange specified.
          schema:
            default: _
            allOf:
              - $ref: schemas/timerange.json
        - name: reverse_order
          in: query
          description: Return Track Events in reverse time order.
          schema:
            default: false
            type: boolean
        - $ref: "#/components/parameters/trait_resource_paged_page"
        - $ref: "#/components/parameters/trait_resource_paged_limit"
      responses:
        "200":
          description: Return the list of Track Events owned by the Track.
          headers:
            Link:
              $ref: "#/components/headers/Link"
            X-Paging-NextKey:
              $ref: "#/components/headers/X-Paging-NextKey"
            X-Paging-Limit:
              $ref: "#/components/headers/X-Paging-Limit"
            X-Paging-Count:
              $ref: "#/components/headers/X-Paging-Count"
            X-Paging-Reverse-Order:
              $ref: "#/components/headers/X-Paging-Reverse-Order"
            X-Paging-Timerange:
              $ref: "#/components/headers/X-Paging-Timerange"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: schemas/track-event-get.json
              example:
                $ref: examples/track-events-get-200.json
        "400":
          $ref: "#/components/responses/trait_resource_400_invalid_query_options"
        "404":
          $ref: "#/components/responses/trait_resource_404_path_not_found"
    post:
      summary: Create or Modify Track Events
      description: |
        Create or modify either a single Track Event or an array of Track Events.

        Each Track Event attaches payload data to a specified timerange on the Track timeline.

        Only permitted if the Track property `read_only` is not 'true'.

        The request body must consist of either a single Track Event or an array of one or more Track Events.

        Each Track Event in the request body MAY specify an `id` to identify the Track Event. For example, this could be used to edit Track Events or when transferring Tracks between Store Instances.

        For each Track Event in the request body:

        * If the Track Event does not specify an `id` then this is an instruction to create a new Track Event in the Store Instance. The Service Implementation MUST generate an `id` for the Track Event.
        * If the Track Event specifies an `id`:
          * If a Track Event with this `id` already exists in the Store Instance then this is an instruction to replace it with the Track Event provided.
          * If a Track Event with this `id` does not exist in the Store Instance then this is an instruction to create a new Track Event with the specified `id`.

        The Service Implementation SHOULD attempt to process all the Track Events in the request body regardless of any errors that might occur. That is, an error in processing one Track Event SHOULD NOT prevent the other Track Events from being processed.

        A 200 response provides the results of processing the Track Events. Inside this response body, the `http_status_code` property MUST use the following values:

        * `200`: Success. Track Event replaced/modified/updated.
          * This applies even if the values of the Track Event properties have not changed, in which case the Track Event can be considered "reaffirmed".
        * `201`: Success. Track Event created.
        * `400`: Error. The Track Event violates at least one constraint. Such constraints include:
          * The `id` of each Track Event MUST be unique within the Store Instance.
          * Each Track Event MUST belong to exactly one Track. As such, each Track Event attaches one `payload` to one `timerange` on one Track.
          * `payload` MUST validate against the Track's Payload Schema, identified by the `schema_id` property of the Track.
          * `timerange` MUST be valid according to the `timerange` definition and the relevant Track properties (such as `edit_rate` and `allow_overlaps`).
        * `403`: Error. You do not have permission to carry out the creation/modification of this Track Event.
      operationId: POST_tracks-track_id-events
      tags:
        - TrackEvents
      requestBody:
        content:
          application/json:
            example:
              $ref: examples/track-event-post.json
            schema:
              oneOf:
                - $ref: schemas/track-event-post.json
                - type: array
                  items:
                    $ref: schemas/track-event-post.json
                  minItems: 1
        required: true
      responses:
        "200":
          description: Return the list of Track Events responses.
          content:
            application/json:
              schema:
                $ref: schemas/track-event-post-responses.json
              example:
                $ref: examples/track-event-post-responses.json
        "400":
          description: Bad request. The request body JSON is not valid with respect to the specified JSON Schema.
        "403":
          description: Forbidden. You do not have permission to modify this Track. It could be marked read-only.
        "404":
          $ref: "#/components/responses/trait_resource_404_path_not_found"
    delete:
      summary: Delete Track Events
      description: |
        Delete the Track Events owned by the Track.

        Only permitted if the Track property `read_only` is not 'true'.

        If Track Event deletion takes too long then this request will return 202 Accepted and the `Location` header will point to a Track Delete Request to monitor deletion progress.
      operationId: DELETE_tracks-track_id-events
      tags:
        - TrackEvents
      parameters:
        - name: timerange
          in: query
          description: Delete only the Track Events that wholly overlap with the timerange specified.
          schema:
            default: _
            allOf:
              - $ref: schemas/timerange.json
        - name: ids
          in: query
          description: Filter on Track Event identifier(s).
          schema:
            $ref: schemas/uuid-list.json
      responses:
        "202":
          description: Accepted. This request has taken longer than the configured timeout, and will continue asynchronously.
          headers:
            Location:
              schema:
                type: string
                example: /track-delete-requests/{request_id}
          content:
            application/json:
              schema:
                $ref: schemas/track-delete-request.json
              example:
                $ref: examples/track-delete-request-get-200.json
        "204":
          description: No content. The Track Events have been deleted.
        "400":
          $ref: "#/components/responses/trait_resource_400_invalid_query_options"
        "403":
          description: Forbidden. You do not have permission to modify this Track. It could be marked read-only.
        "404":
          $ref: "#/components/responses/trait_resource_404_path_not_found"
  /track-delete-requests:
    head:
      summary: List Track Delete Requests
      description: Return `/track-delete-requests` path headers
      operationId: HEAD_track-delete-requests
      tags:
        - TrackDeleteRequests
      parameters:
        - name: reverse_order
          in: query
          description: Return Track Delete Requests in reverse order.
          schema:
            default: false
            type: boolean
        - name: sort_by
          in: query
          description: |
            Parameter to sort Track Delete Requests by.
            `created` and `expiry` sort most recent first by default.
            Sorting may be reversed using the `reverse_order` query parameter.
            Assume `created` if not set.
            For resources where the selected parameter is unset, `id` shall be used.
            Resources using this fallback shall be sorted after those that aren't by default, and before when `reverse_order` is `true`.
          schema:
            type: string
            enum:
              - created
              - expiry
        - $ref: "#/components/parameters/trait_resource_paged_page"
        - $ref: "#/components/parameters/trait_resource_paged_limit"
      responses:
        "200":
          description: ""
          headers:
            Link:
              $ref: "#/components/headers/Link"
            X-Paging-NextKey:
              $ref: "#/components/headers/X-Paging-NextKey"
            X-Paging-Limit:
              $ref: "#/components/headers/X-Paging-Limit"
            X-Paging-Count:
              $ref: "#/components/headers/X-Paging-Count"
            X-Paging-Reverse-Order:
              $ref: "#/components/headers/X-Paging-Reverse-Order"
        "400":
          $ref: "#/components/responses/trait_resource_400_invalid_query_options"
    get:
      summary: List Track Delete Requests
      description: |
        Return the list of Track Delete Requests.

        A Track Delete Request is created when a client DELETEs a long timerange of Track Events, which takes longer than a single HTTP request.

        Track Delete Requests currently being worked on are listed, for monitoring in development.

        This will not necessarily list all requests, nor return a consistent set in any particular order, and should not be relied upon by clients. However if there are any requests in the system, it will always return at least one.
      operationId: GET_track-delete-requests
      tags:
        - TrackDeleteRequests
      parameters:
        - name: reverse_order
          in: query
          description: Return Track Delete Requests in reverse order.
          schema:
            default: false
            type: boolean
        - name: sort_by
          in: query
          description: |
            Parameter to sort Track Delete Requests by.
            `created` and `expiry` sort most recent first by default.
            Sorting may be reversed using the `reverse_order` query parameter.
            Assume `created` if not set.
            For resources where the selected parameter is unset, `id` shall be used.
            Resources using this fallback shall be sorted after those that aren't by default, and before when `reverse_order` is `true`.
          schema:
            type: string
            enum:
              - created
              - expiry
        - $ref: "#/components/parameters/trait_resource_paged_page"
        - $ref: "#/components/parameters/trait_resource_paged_limit"
      responses:
        "200":
          description: Return the list of Track Delete Requests.
          headers:
            Link:
              $ref: "#/components/headers/Link"
            X-Paging-NextKey:
              $ref: "#/components/headers/X-Paging-NextKey"
            X-Paging-Limit:
              $ref: "#/components/headers/X-Paging-Limit"
            X-Paging-Count:
              $ref: "#/components/headers/X-Paging-Count"
            X-Paging-Reverse-Order:
              $ref: "#/components/headers/X-Paging-Reverse-Order"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: schemas/track-delete-request.json
              example:
                $ref: examples/track-delete-requests-get-200.json
        "400":
          $ref: "#/components/responses/trait_resource_400_invalid_query_options"
  /track-delete-requests/{request_id}:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
    head:
      summary: Track Delete Request Details
      description: Return `/track-delete-requests/{request_id}` path headers
      operationId: HEAD_track-delete-requests-request_id
      tags:
        - TrackDeleteRequests
      responses:
        "200":
          description: ""
        "404":
          $ref: "#/components/responses/trait_resource_404_path_not_found"
    get:
      summary: Track Delete Request Details
      description: |
        Return the Track Delete Request details.

        A Track Delete Request is created when a client DELETEs a long timerange of Track Events, which takes longer than a single HTTP request.

        Clients will be pointed here to monitor the request's progress.
      operationId: GET_track-delete-requests-request_id
      tags:
        - TrackDeleteRequests
      responses:
        "200":
          description: Return the Track Delete Request details.
          content:
            application/json:
              schema:
                $ref: schemas/track-delete-request.json
              example:
                $ref: examples/track-delete-request-get-200.json
        "404":
          $ref: "#/components/responses/trait_resource_404_path_not_found"
