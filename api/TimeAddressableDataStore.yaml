                  required:
                    - track
                  properties:
                    track:
                      $ref: schemas/track.json
      responses:
        "200":
          description: Webhook received successfully
  tracks/deleted:
    post:
      security:
        - {}
      requestBody:
        content:
          application/json:
            schema:
              title: Track Deleted Notification
              description: Notification that a Track has been deleted (or scheduled for deletion).
              required:
                - event_timestamp
                - event_type
                - event
              properties:
                event_timestamp:
                  description: Timestamp at which the Track was deleted
                  type: string
                  format: date-time
                event_type:
                  type: string
                  const: tracks/deleted
                event:
                  type: object
                  required:
                    - track_id
                  properties:
                    track_id:
                      $ref: schemas/uuid.json
      responses:
        "200":
          description: Webhook received successfully
  tracks/events_added:
    post:
      security:
        - {}
      requestBody:
        content:
          application/json:
            schema:
              title: Track Events Added
              description: |
                Notification that new Track Events have been added to a Track.
              required:
                - event_timestamp
                - event_type
                - event
              properties:
                event_timestamp:
                  description: Timestamp at which the most recent addition of a Track Event in this batch took place (and the message generated)
                  type: string
                  format: date-time
                event_type:
                  type: string
                  const: tracks/events_added
                event:
                  type: object
                  required:
                    - track_id
                    - track_events
                  properties:
                    track_id:
                      $ref: schemas/uuid.json
                    track_events:
                      type: array
                      items:
                        $ref: schemas/track-event-get.json
      responses:
        "200":
          description: Webhook received successfully
  tracks/events_updated:
    post:
      security:
        - {}
      requestBody:
        content:
          application/json:
            schema:
              title: Track Events Updated
              description: |
                Notification that Track Events on a Track have been updated.
              required:
                - event_timestamp
                - event_type
                - event
              properties:
                event_timestamp:
                  description: Timestamp at which the most recent update of a Track Event in this batch took place (and the message generated)
                  type: string
                  format: date-time
                event_type:
                  type: string
                  const: tracks/events_updated
                event:
                  type: object
                  required:
                    - track_id
                    - track_events
                  properties:
                    track_id:
                      $ref: schemas/uuid.json
                    track_events:
                      type: array
                      items:
                        $ref: schemas/track-event-get.json
      responses:
        "200":
          description: Webhook received successfully
  tracks/events_deleted:
    post:
      security:
        - {}
      requestBody:
        content:
          application/json:
            schema:
              title: Track Events Deleted
              description: |
                Notification that Track Events have been deleted from a Track.
              required:
                - event_timestamp
                - event_type
                - event
              properties:
                event_timestamp:
                  description: Timestamp at which the most recent delete of a Track Event in the reported list (`track_event_ids`) took place (and the message generated)
                  type: string
                  format: date-time
                event_type:
                  type: string
                  const: tracks/events_deleted
                event:
                  type: object
                  required:
                    - track_id
                    - track_event_ids
                  properties:
                    track_id:
                      $ref: schemas/uuid.json
                    timerange:
                      description: The timerange covered by the Track Events that have been deleted. This property MUST only be present if all the Track Events that wholly overlap with this timerange have been deleted from the specified Track. The `timerange` start MUST match the earliest start value of a deleted Track Event's `timerange`. The `timerange` end MUST match the latest end value of a deleted Track Event's `timerange`.
                      $ref: schemas/timerange.json
                    track_event_ids:
                      description: The Track Event IDs that have been deleted
                      $ref: schemas/uuid-list.json
      responses:
        "200":
          description: Webhook received successfully
components:
  responses:
    trait_resource_400_invalid_query_options:
      description: Bad request. Invalid query options.
    trait_resource_400_invalid_request_body:
      description: Bad request. Request body JSON is not valid. For example, one or more JSON properties could have invalid values.
    trait_resource_403_delete_forbidden:
      description: Forbidden. You do not have permission to delete this resource.
    trait_resource_403_modify_forbidden:
      description: Forbidden. You do not have permission to modify this resource.
    trait_resource_404_path_not_found:
      description: Not found. The resource identified by the path does not exist.
    trait_resource_404_path_not_valid:
      description: Not found. The path is not a valid resource identifier. One or more parameters in the path are incorrectly formatted.
  parameters:
    trait_resource_paged_limit:
      name: limit
      in: query
      description: Restrict the response to the specified number of results. Service Implementations may specify their own default and maximum for the limit
      schema:
        type: integer
    trait_resource_paged_page:
      name: page
      in: query
      description: Opaque string generated by the Service Instance that is used to access a specific page of results. Clients should read the next URL from the `Link` header returned with responses, or use the value of the returned `X-Paging-NextKey` header. If `page` is not supplied, the first page is accessed. Service Implementations should ensure a consistent sort order is applied to pages of results.
      schema:
        type: string
  headers:
    Link:
      description: Provides references to cursors for paging. Only the 'rel' attribute with value 'next' and a link to the next page is currently supported. If 'next' is not present then it is the last page.
      schema:
        type: string
    X-Paging-NextKey:
      description: Opaque string that can be supplied to the `page` query parameter to get the next page of results.
      schema:
        type: string
    X-Paging-Limit:
      description: Identifies the current limit being used for paging. This may not match the requested value if the requested value was too high for the Service Implementation.
      schema:
        type: integer
    X-Paging-Count:
      description: The number of items in the returned data set.
      schema:
        type: integer
    X-Paging-Reverse-Order:
      description: The items are returned in reverse order.
      schema:
        type: boolean
    X-Paging-Timerange:
      description: Identifies the timerange for the returned data set.
      schema:
        $ref: schemas/timerange.json
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
      description: |
        HTTP basic authentication using a username and password.

        This option should only be used in constrained cases where Bearer tokens are impractical, since the password is intrinsically long-lived, and managing user credentials across systems is difficult compared to using centralised auth (e.g. via OAuth2) with Bearer tokens
    bearer_token_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HTTP bearer token authentication.

        The method through which a client should acquire a bearer token is assumed to be an OAuth2 grant (either the Authorization Code or Client Credentials grant), however the OpenAPI `OAuth Flow` object cannot be used because it requires that the relevant URLs are known in advance.

        Clients should provide options to allow one (or both) grant types to be configured, as appropriate.

        Where tokens are not JWTs, or are acquired through some other mechanism, the API key method should be used instead.
    url_token_auth:
      type: apiKey
      name: access_token
      in: query
      description: |
        URL token authentication.

        The method through which a client should acquire the token is not specified: it is assumed this takes place in another way, and a TADS client may well be passed a URL to a TADS Service Instance including the token.

        Clients should retain the token in the `access_token` query string parameter, and use it for subsequent requests to the TADS Service Instance in the same session.
